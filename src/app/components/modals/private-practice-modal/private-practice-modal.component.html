<section class="overlay" role="dialog" aria-modal="true" aria-label="Private practice">
  <div class="overlay-card">
    <p class="kicker">Private practice</p>
    <h2>One-time session</h2>
    <p class="subtle">This is not saved, tracked, or stored. When you finish or discard it, it disappears.</p>

    <form class="form-stack" (ngSubmit)="start.emit()">
      <label>
        <span>Statement</span>
        <textarea
          name="private-statement"
          [(ngModel)]="draft().text"
          rows="4"
          placeholder="Write the exact line you want to repeat."
          required
        ></textarea>
      </label>

      <label>
        <span>Repetitions</span>
        <input
          name="private-repetitions"
          type="number"
          min="1"
          max="108"
          [(ngModel)]="draft().repetitions"
          required
        />
      </label>

      <div class="actions">
        <button type="submit" class="button-primary full-width">Start private session</button>
        <button type="button" class="button-ghost full-width" (click)="cancel.emit()">Cancel</button>
      </div>
    </form>
  </div>
</section>
