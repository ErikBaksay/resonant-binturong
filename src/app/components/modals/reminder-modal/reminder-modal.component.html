<section class="overlay" role="dialog" aria-modal="true" aria-label="Reminder due">
  <div class="overlay-card">
    <p class="kicker">Reminder due</p>
    <h2>{{ reminder().title }}</h2>
    <p class="subtle">{{ reminder().label }}. This stays open until the session is completed inside the app.</p>

    <div class="quote-box">
      <p>{{ reminder().text }}</p>
    </div>

    <div class="overlay-meta">
      <span>{{ reminder().defaultRepetitions }} reps</span>
      <span>{{ formatRelativeReminder()(reminder()) }}</span>
    </div>

    <button type="button" class="button-primary full-width" (click)="start.emit(reminder())">Start scheduled session</button>
  </div>
</section>
